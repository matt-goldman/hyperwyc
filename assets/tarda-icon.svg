<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Tarda icon</title>
  <!--
    Tarda - Hyperwyc mascot. Reduced mark for small sizes
    (NuGet package icon, favicon, GitHub social icon).

    Detail is deliberately stripped: no claws, one segment line,
    solid pupil instead of the concentric mouth rings, heavier
    linework. Holds at 32px. Works on light or dark backgrounds.

    Body angle: change the -15 in #body's rotate(-15 64 60).
  -->

  <!-- legs -->
  <g fill="#D98E2E">
    <rect x="18" y="78" width="20" height="24" rx="8"/>
    <rect x="46" y="84" width="20" height="24" rx="8"/>
    <rect x="80" y="80" width="20" height="24" rx="8"/>
    <rect x="98" y="66" width="20" height="24" rx="8"/>
  </g>

  <!-- body -->
  <g id="body" transform="rotate(-15 64 60)">
    <ellipse cx="78" cy="62" rx="40" ry="34" fill="#EBA341"/>
    <path d="M88,32 Q102,62 88,92" fill="none" stroke="#7A4A12" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- head -->
  <circle cx="46" cy="56" r="30" fill="#EBA341" stroke="#7A4A12" stroke-width="4"/>

  <!-- mouth -->
  <circle cx="44" cy="58" r="15" fill="#C97F25"/>
  <circle cx="44" cy="58" r="7" fill="#1C1F24"/>

  <!-- eyes -->
  <circle cx="27" cy="42" r="4" fill="#1C1F24"/>
  <circle cx="61" cy="41" r="4" fill="#1C1F24"/>
</svg>
