<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Tarda</title>
  <!--
    Tarda - Hyperwyc mascot. Full mark, for DARK backgrounds
    (claw strokes are light; use tarda-full-light.svg on light backgrounds).

    Tinkering notes:
      - Body angle: change the -15 in #body's rotate(-15 64 60).
        Positive tilts the tail down, negative lifts it. Past about -20
        you'll need to raise the two rear legs to keep them attached.
      - Palette: EBA341 body, D98E2E legs, C97F25 mouth outer,
        7A4A12 linework, 1C1F24 eyes/pupil.
  -->

  <!-- legs -->
  <g fill="#D98E2E">
    <rect x="20" y="78" width="16" height="22" rx="7"/>
    <rect x="48" y="84" width="16" height="22" rx="7"/>
    <rect x="82" y="80" width="16" height="22" rx="7"/>
    <rect x="100" y="66" width="16" height="22" rx="7"/>
  </g>

  <!-- claws -->
  <g stroke="#E6E1D6" stroke-width="1.8" stroke-linecap="round">
    <line x1="24" y1="100" x2="22" y2="105"/><line x1="28" y1="100" x2="28" y2="106"/><line x1="32" y1="100" x2="34" y2="105"/>
    <line x1="52" y1="106" x2="50" y2="111"/><line x1="56" y1="106" x2="56" y2="112"/><line x1="60" y1="106" x2="62" y2="111"/>
    <line x1="86" y1="102" x2="84" y2="107"/><line x1="90" y1="102" x2="90" y2="108"/><line x1="94" y1="102" x2="96" y2="107"/>
    <line x1="104" y1="88" x2="102" y2="93"/><line x1="108" y1="88" x2="108" y2="94"/><line x1="112" y1="88" x2="114" y2="93"/>
  </g>

  <!-- body -->
  <g id="body" transform="rotate(-15 64 60)">
    <ellipse cx="78" cy="62" rx="40" ry="34" fill="#EBA341"/>
    <g fill="none" stroke="#7A4A12" stroke-width="2.5" stroke-linecap="round">
      <path d="M76,31 Q90,62 76,93"/>
      <path d="M98,34 Q110,62 98,90"/>
    </g>
  </g>

  <!-- head -->
  <circle cx="46" cy="56" r="30" fill="#EBA341" stroke="#7A4A12" stroke-width="2.5"/>
  <path d="M26,72 Q44,86 64,72" fill="none" stroke="#7A4A12" stroke-width="2" stroke-linecap="round"/>

  <!-- mouth -->
  <circle cx="44" cy="58" r="13" fill="#C97F25"/>
  <circle cx="44" cy="58" r="9" fill="#EBA341" stroke="#7A4A12" stroke-width="2"/>
  <circle cx="44" cy="58" r="5" fill="#1C1F24"/>

  <!-- eyes -->
  <circle cx="28" cy="44" r="3" fill="#1C1F24"/>
  <circle cx="60" cy="43" r="3" fill="#1C1F24"/>
</svg>
